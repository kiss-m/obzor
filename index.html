const AVATAR_COLORS = ['#2f6fb0', '#b0482f', '#2f8a5b', '#7a4fb0', '#b07a1f', '#1f8a8a', '#a8406f', '#586a7d'];
const hash = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
const initials = (name) => name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

const Bd = {
  list: [],
  init() {
    const saved = store.get('birthdays', []);
    this.list = Array.isArray(saved) ? saved : [];
    $('#bd-add').innerHTML = ico('plus', 18, 2.2) + 'Pridať';
    $('#bd-add').addEventListener('click', () => this.openForm());
    $('#bk-export').addEventListener('click', () => Backup.export());
    $('#bk-import').addEventListener('click', () => $('#bk-file').click());
    $('#bk-file').addEventListener('change', (e) => Backup.import(e.target.files[0]));
  },
  save() { store.set('birthdays', this.list); },

  dateIn(p, y) {
    let day = p.day;
    if (p.month === 2 && day === 29 && !isLeap(y)) day = 28;
    return new Date(y, p.month - 1, day);
  },
  next(p, from = today()) {
    let d = this.dateIn(p, from.getFullYear());
    if (d < from) d = this.dateIn(p, from.getFullYear() + 1);
    return { date: d, days: daysBetween(from, d), age: p.year ? d.getFullYear() - p.year : null };
  },
  upcoming(from = today()) {
    return this.list.map((p) => ({ p, ...this.next(p, from) })).sort((a, b) => a.days - b.days || a.p.name.localeCompare(b.p.name, 'sk'));
  },
  on(date) { return this.list.filter((p) => { const d = this.dateIn(p, date.getFullYear()); return d.getMonth() === date.getMonth() && d.getDate() === date.getDate(); }); },
  /** Ľudia zo zoznamu, ktorí majú v daný deň meniny (SK) alebo svátek (CZ) */
  namedayOn(date) {
    const info = Kal.forDate(date);
    const names = new Set([...info.sk.split(','), ...info.cz.split(',')].map(norm).filter(Boolean));
    return this.list.filter((p) => names.has(norm(p.name.trim().split(/\s+/)[0])));
  },

  whenLabel(days) { return days === 0 ? 'Dnes' : days === 1 ? 'Zajtra' : `o ${days} ${plural(days, 'deň', 'dni', 'dní')}`; },
  ageLabel(age, days) {
    if (age == null) return '';
    const yrs = `${age} ${plural(age, 'rok', 'roky', 'rokov')}`;
    return days === 0 ? `dnes má ${yrs}` : `bude mať ${yrs}`;
  },

  render() {
    const box = $('#bd-content'), sub = $('#bd-sub');
    const up = this.upcoming();
    if (!up.length) {
      sub.textContent = '';
      box.innerHTML = `<div class="panel empty">${ico('gift', 44, 1.5)}<h2>Zatiaľ tu nikto nie je</h2><p>Pridaj ľudí, na ktorých narodeniny nechceš zabudnúť. V deň oslavy ti ich appka ukáže hneď pri spustení.</p><button class="btn btn-primary" id="bd-add-first">${ico('plus', 18, 2.2)}Pridať prvé narodeniny</button></div>`;
      $('#bd-add-first').addEventListener('click', () => this.openForm());
      return;
    }
    const n = up.length;
    sub.textContent = `${n} ${plural(n, 'človek', 'ľudia', 'ľudí')} · najbližšie ${up[0].days === 0 ? 'dnes' : up[0].days === 1 ? 'zajtra' : 'o ' + up[0].days + ' ' + plural(up[0].days, 'deň', 'dni', 'dní')}: ${up[0].p.name}`;
    box.innerHTML = `<ul class="bd-list panel">${up.map(({ p, days, age }) => {
      const nd = Kal.lookup(p.name.trim().split(/\s+/)[0]);
      let ndTxt = '';
      if (nd) {
        const sk = nd.sk[0], cz = nd.cz[0];
        if (sk && cz && sk.m === cz.m && sk.d === cz.d) ndTxt = `meniny ${sk.d}. ${sk.m}.`;
        else ndTxt = [sk ? `meniny ${sk.d}. ${sk.m}.` : '', cz ? `svátek ${cz.d}. ${cz.m}.` : ''].filter(Boolean).join(', ');
      }
      const meta = [`${p.day}. ${MESIACE_GEN[p.month - 1]}${p.year ? ' ' + p.year : ''}`, this.ageLabel(age, days), ndTxt, p.note].filter(Boolean);
      return `<li><button class="bd-row${days === 0 ? ' today' : ''}" data-id="${esc(p.id)}">
        <span class="avatar" style="background:${AVATAR_COLORS[hash(p.name) % AVATAR_COLORS.length]}">${esc(initials(p.name))}</span>
        <span><span class="bd-name">${esc(p.name)}</span><span class="bd-meta">${meta.map((m) => `<span>${esc(m)}</span>`).join('')}</span></span>
        <span class="bd-when">${days <= 1 ? `<b>${this.whenLabel(days)}</b>` : `<b>${days}</b><small>${plural(days, 'deň', 'dni', 'dní')}</small>`}</span>
      </button></li>`;
    }).join('')}</ul>`;
    $$('.bd-row', box).forEach((b) => b.addEventListener('click', () => this.openForm(b.dataset.id)));
  },

  openForm(id) {
    const p = id ? this.list.find((x) => x.id === id) : null;
    const days = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${p && p.day === i + 1 ? 'selected' : ''}>${i + 1}.</option>`).join('');
    const months = MESIACE.map((m, i) => `<option value="${i + 1}" ${p && p.month === i + 1 ? 'selected' : ''}>${m}</option>`).join('');
    Sheet.open(`
      <div class="sheet-h"><h2 id="bd-title">${p ? 'Upraviť narodeniny' : 'Nové narodeniny'}</h2><div class="actions"><button class="btn" data-close aria-label="Zavrieť">${ico('close', 18, 2)}</button></div></div>
      <form class="form" id="bd-form" novalidate>
        <label class="field"><span>Meno</span><input id="bd-name" maxlength="60" autocomplete="off" placeholder="napr. Jana Nováková" value="${p ? esc(p.name) : ''}"></label>
        <div class="field-row">
          <label class="field"><span>Deň</span><select id="bd-day">${days}</select></label>
          <label class="field"><span>Mesiac</span><select id="bd-month">${months}</select></label>
          <label class="field"><span>Rok <em>(nepovinný)</em></span><input id="bd-year" inputmode="numeric" maxlength="4" placeholder="napr. 1990" value="${p && p.year ? p.year : ''}"></label>
        </div>
        <label class="field"><span>Poznámka <em>(nepovinná)</em></span><input id="bd-note" maxlength="120" autocomplete="off" placeholder="napr. rada čokoládu" value="${p && p.note ? esc(p.note) : ''}"></label>
        <p class="form-hint" id="bd-hint"></p>
        <p class="form-err" id="bd-err" hidden></p>
        <div class="form-actions">
          ${p ? '<button type="button" class="btn btn-danger" id="bd-del">Zmazať</button>' : ''}
          <span class="spacer"></span>
          <button type="button" class="btn" data-close>Zrušiť</button>
          <button type="submit" class="btn btn-primary">Uložiť</button>
        </div>
      </form>`, { label: 'bd-title' });

    const hint = () => {
      const name = $('#bd-name').value.trim().split(/\s+/)[0];
      const nd = name ? Kal.lookup(name) : null;
      const parts = [];
      if (nd && nd.sk.length) parts.push('meniny na Slovensku ' + nd.sk.map((x) => shortDate(x.m, x.d)).join(' a '));
      if (nd && nd.cz.length) parts.push('svátek v Česku ' + nd.cz.map((x) => shortDate(x.m, x.d)).join(' a '));
      $('#bd-hint').textContent = parts.length ? `${name} má ${parts.join(', ')}.` : '';
    };
    hint();
    $('#bd-name').addEventListener('input', hint);
    $('#bd-form').addEventListener('input', () => { $('#bd-err').hidden = true; });
    if (!p) setTimeout(() => $('#bd-name').focus(), 60);

    const del = $('#bd-del');
    if (del) del.addEventListener('click', () => {
      if (!del.classList.contains('armed')) { del.classList.add('armed'); del.textContent = 'Naozaj zmazať?'; return; }
      const i = this.list.findIndex((x) => x.id === p.id);
      const [removed] = this.list.splice(i, 1);
      this.save(); Sheet.close(); this.render();
      toast(`Zmazané: ${removed.name}`, 'Späť', () => { this.list.splice(i, 0, removed); this.save(); this.render(); });
    });

    $('#bd-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const err = $('#bd-err');
      const name = $('#bd-name').value.trim().replace(/\s+/g, ' ');
      const day = +$('#bd-day').value, month = +$('#bd-month').value;
      const yRaw = $('#bd-year').value.trim();
      const year = yRaw ? +yRaw : null;
      const note = $('#bd-note').value.trim();
      const maxDay = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][month - 1];
      let msg = '';
      if (!name) msg = 'Napíš meno.';
      else if (day > maxDay) msg = `${MESIACE[month - 1][0].toUpperCase() + MESIACE[month - 1].slice(1)} má najviac ${maxDay} dní.`;
      else if (yRaw && (!/^\d{4}$/.test(yRaw) || year < 1900 || year > new Date().getFullYear())) msg = `Rok napíš ako štvorciferné číslo od 1900 do ${new Date().getFullYear()}, alebo ho nechaj prázdny.`;
      else if (year && month === 2 && day === 29 && !isLeap(year)) msg = `Rok ${year} nebol priestupný, 29. február v ňom nebol.`;
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      if (p) Object.assign(p, { name, day, month, year, note });
      else this.list.push({ id: 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, day, month, year, note });
      this.save(); Sheet.close(); this.render();
      toast(p ? 'Zmeny sú uložené.' : `Pridané: ${name}`);
    });
  }
};

/* ---------- Záloha ---------- */
const Backup = {
  export() {
    const data = { app: 'obzor', version: 1, exported: new Date().toISOString(), birthdays: Bd.list, places: Wx.places };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const t = today();
    a.download = `obzor-zaloha-${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Záloha je stiahnutá.');
  },
  async import(file) {
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!data || data.app !== 'obzor' || !Array.isArray(data.birthdays)) throw new Error();
      const ok = (p) => p && typeof p.name === 'string' && p.day >= 1 && p.day <= 31 && p.month >= 1 && p.month <= 12;
      Bd.list = data.birthdays.filter(ok).map((p) => ({ id: String(p.id || 'b' + Math.random().toString(36).slice(2)), name: p.name, day: +p.day, month: +p.month, year: p.year ? +p.year : null, note: p.note || '' }));
      Bd.save();
      if (Array.isArray(data.places) && data.places.length) {
        Wx.places = data.places.filter((p) => p && p.id && typeof p.lat === 'number' && typeof p.lon === 'number');
        Wx.sel = 0; Wx.save();
        Wx.refreshAll();
      }
      Bd.render();
      toast(`Obnovené: ${Bd.list.length} ${plural(Bd.list.length, 'narodeniny', 'narodeniny', 'narodenín')}, ${Wx.places.length} ${plural(Wx.places.length, 'miesto', 'miesta', 'miest')}.`);
    } catch {
      toast('Tento súbor nie je záloha z appky Obzor.');
    } finally {
      $('#bk-file').value = '';
    }
  }
};

/* ============================================================
   List trhacieho kalendára (úvod + záložka Kalendár)
   ============================================================ */
function calPageHTML(date, { progress = false, withBirthdays = true } = {}) {
  const info = Kal.forDate(date);
  const red = date.getDay() === 0 || !!info.skHol;
  const y = date.getFullYear();
  const doy = daysBetween(new Date(y, 0, 1), date) + 1;
  const left = (isLeap(y) ? 366 : 365) - doy;

  let hol = '';
  if (info.skHol) hol += esc(info.skHol);
  if (info.czHol && info.czHol !== info.skHol) hol += `<small>ČR: ${esc(info.czHol)}</small>`;

  let bdays = '';
  if (withBirthdays) {
    const todayList = Bd.on(date).map((p) => {
      const age = p.year ? date.getFullYear() - p.year : null;
      return `<b>${esc(p.name)}</b>${age != null ? ` (${age})` : ''}`;
    });
    if (todayList.length) {
      bdays += `<div class="cal-bday">${ico('cake', 20, 1.8)}<div>Narodeniny ${todayList.length > 1 ? 'majú' : 'má'} ${todayList.join(', ')}</div></div>`;
    }
    const nameday = Bd.namedayOn(date).map((p) => `<b>${esc(p.name)}</b>`);
    if (nameday.length) {
      bdays += `<div class="cal-bday">${ico('gift', 20, 1.8)}<div>${nameday.length > 1 ? 'Meniny oslavujú' : 'Meniny oslavuje'} ${nameday.join(', ')}</div></div>`;
    }
    if (!todayList.length) {
      const soon = Bd.upcoming(date).filter((u) => u.days > 0 && u.days <= 7).slice(0, 2);
      if (soon.length) {
        bdays += `<div class="cal-bday soft">${ico('cake', 20, 1.8)}<div>Čoskoro: ${soon.map((u) => `<b>${esc(u.p.name)}</b> ${u.days === 1 ? 'zajtra' : `o ${u.days} ${plural(u.days, 'deň', 'dni', 'dní')} (${DNI[u.date.getDay()]})`}`).join(', ')}</div></div>`;
      }
    }
  }

  const names = (s) => s ? `<dd>${esc(s)}</dd>` : '<dd class="none">bez mena</dd>';
  return `<div class="cal-block"><article class="cal-page" aria-label="${date.getDate()}. ${MESIACE_GEN[date.getMonth()]} ${y}, ${DNI[date.getDay()]}">
    <div class="cal-bind"><span></span><span></span></div>
    <div class="cal-perf"></div>
    <div class="cal-head"><span>${MESIACE[date.getMonth()]}</span><span>${y}</span></div>
    <div class="cal-day${red ? ' cal-red' : ''}">${date.getDate()}</div>
    <div class="cal-dow${red ? ' cal-red' : ''}">${DNI[date.getDay()]}</div>
    ${hol ? `<div class="cal-hol">${hol}</div>` : ''}
    <dl class="cal-names">
      <div><dt>Meniny SK</dt>${names(info.sk)}</div>
      <div><dt>Svátek CZ</dt>${names(info.cz)}</div>
    </dl>
    ${bdays}
    <div class="cal-foot"><span>${isoWeek(date)}. týždeň · ${doy}. deň roka</span><span>do konca roka ${left} ${plural(left, 'deň', 'dni', 'dní')}</span></div>
    ${progress ? '<div class="cal-progress"><i></i></div>' : ''}
  </article></div>`;
}

/* ---------- Úvodná obrazovka ---------- */
const Splash = {
  ms: 4000, timer: 0,
  show() {
    const el = $('#splash');
    $('#splash-inner').innerHTML = calPageHTML(today(), { progress: true }) + '<p class="splash-hint">Ťukni kamkoľvek a pokračuj</p>';
    el.style.setProperty('--splash-ms', this.ms + 'ms');
    el.hidden = false;
    el.classList.remove('tearing', 'run');
    void el.offsetWidth;
    el.classList.add('run');
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.hide(), this.ms);
  },
  hide() {
    const el = $('#splash');
    if (el.hidden || el.classList.contains('tearing')) return;
    clearTimeout(this.timer);
    el.classList.add('tearing');
    setTimeout(() => { el.hidden = true; el.classList.remove('tearing', 'run'); }, 700);
  },
  init() {
    $('#splash').addEventListener('click', () => this.hide());
    document.addEventListener('keydown', (e) => { if (!$('#splash').hidden && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) this.hide(); });
    this.show();
  }
};

/* ---------- Záložka Kalendár ---------- */
const KalView = {
  offset: 0,
  init() {
    $('#kal-prev').innerHTML = ico('left', 18, 2.2);
    $('#kal-next').innerHTML = ico('right', 18, 2.2);
    $('#nd-ico').innerHTML = ico('search', 18);
    $('#kal-prev').addEventListener('click', () => { this.offset--; this.renderPage(); });
    $('#kal-next').addEventListener('click', () => { this.offset++; this.renderPage(); });
    $('#kal-today').addEventListener('click', () => { this.offset = 0; this.renderPage(); });
    $('#nd-q').addEventListener('input', (e) => this.renderSearch(e.target.value));
  },
  render() { this.renderPage(); this.renderUpcoming(); this.renderSearch($('#nd-q').value); },
  renderPage() {
    $('#kal-page').innerHTML = calPageHTML(addDays(today(), this.offset));
    $('#kal-today').disabled = this.offset === 0;
  },
  renderSearch(q) {
    const ul = $('#nd-results');
    if (norm(q).length < 2) { ul.innerHTML = ''; return; }
    const res = Kal.search(q);
    if (!res.length) { ul.innerHTML = `<li class="muted">Meno „${esc(q.trim())}“ v kalendári nie je.</li>`; return; }
    const fmt = (arr) => arr.map((x) => shortDate(x.m, x.d)).join(' a ');
    ul.innerHTML = res.map((r) => `<li class="panel"><b>${esc(r.name)}</b><div>${[r.sk.length ? 'Meniny SK: ' + fmt(r.sk) : '', r.cz.length ? 'Svátek CZ: ' + fmt(r.cz) : ''].filter(Boolean).join(' · ')}</div></li>`).join('');
  },
  renderUpcoming() {
    const t = today();
    let html = '';
    for (let i = 1; i <= 14; i++) {
      const d = addDays(t, i), info = Kal.forDate(d);
      const red = d.getDay() === 0 || !!info.skHol;
      const bd = Bd.on(d);
      const extra = [];
      if (info.skHol) extra.push(`<div class="up-extra red">${esc(info.skHol)}</div>`);
      if (bd.length) extra.push(`<div class="up-extra red">Narodeniny: ${bd.map((p) => esc(p.name)).join(', ')}</div>`);
      html += `<li><div class="up-date${red ? ' red' : ''}"><b>${d.getDate()}</b><small>${DNI_KR[d.getDay()]} ${d.getMonth() + 1}.</small></div>
        <div><div class="up-names">${esc(info.sk || '—')}${info.cz && info.cz !== info.sk ? ` <small>· CZ ${esc(info.cz)}</small>` : ''}</div>${extra.join('')}</div></li>`;
    }
    $('#kal-upcoming').innerHTML = html;
  }
};

/* ============================================================
   Vysúvacie okno a oznámenia
   ============================================================ */
const Sheet = {
  onClose: null, prevFocus: null,
  open(html, { label, onClose } = {}) {
    this.prevFocus = document.activeElement;
    this.onClose = onClose || null;
    const root = $('#sheet-root');
    root.innerHTML = `<div class="sheet"><div class="sheet-bg" data-close></div><div class="sheet-panel" role="dialog" aria-modal="true" ${label ? `aria-labelledby="${label}"` : ''}>${html}</div></div>`;
    $$('[data-close]', root).forEach((b) => b.addEventListener('click', () => this.close()));
    document.body.style.overflow = 'hidden';
  },
  close() {
    const root = $('#sheet-root');
    if (!root.firstChild) return;
    root.innerHTML = '';
    document.body.style.overflow = '';
    const cb = this.onClose; this.onClose = null;
    if (cb) cb();
    if (this.prevFocus && this.prevFocus.focus) this.prevFocus.focus();
  }
};
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#sheet-root').firstChild) Sheet.close(); });

let toastTimer = 0;
function toast(msg, actionLabel, action) {
  const root = $('#toast-root');
  clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button>` : ''}</div>`;
  const b = $('button', root);
  if (b) b.addEventListener('click', () => { root.innerHTML = ''; action(); });
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, actionLabel ? 6000 : 3000);
}

/* ============================================================
   Aplikácia – záložky, spustenie
   ============================================================ */
const App = {
  tab: 'pocasie',
  tabs: ['pocasie', 'narodeniny', 'kalendar'],
  show(tab) {
    if (!this.tabs.includes(tab)) tab = 'pocasie';
    this.tab = tab;
    store.set('tab', tab);
    this.tabs.forEach((t) => { $('#view-' + t).hidden = t !== tab; });
    $$('.tab').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    document.body.classList.toggle('mode-wx', tab === 'pocasie');
    $('#sky').hidden = tab !== 'pocasie';
    document.querySelector('meta[name="theme-color"]').content = tab === 'pocasie' ? '#1d4f82' : getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#eef2f5';
    if (tab === 'pocasie') Wx.render();
    if (tab === 'narodeniny') Bd.render();
    if (tab === 'kalendar') KalView.render();
    if (location.hash.slice(1) !== tab) history.replaceState(null, '', '#' + tab);
    window.scrollTo({ top: 0 });
  },
  init() {
    fillIcons();
    Bd.init();
    Wx.init();
    KalView.init();
    Splash.init();
    $$('.tab').forEach((b) => b.addEventListener('click', () => this.show(b.dataset.tab)));
    window.addEventListener('hashchange', () => this.show(location.hash.slice(1)));
    this.show(location.hash.slice(1) || store.get('tab', 'pocasie'));
    Wx.refreshAll();

    // Návrat do appky po dlhšej pauze = nové "otvorenie"
    let hiddenAt = 0;
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { hiddenAt = Date.now(); return; }
      const away = hiddenAt ? Date.now() - hiddenAt : 0;
      if (away > 10 * 60 * 1000) {
        Splash.show();
        Wx.refreshAll();
        if (this.tab !== 'pocasie') this.show(this.tab);
      }
      hiddenAt = 0;
    });

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  }
};

App.init();
})();
</script>
