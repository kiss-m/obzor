<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obzor</title>
<meta name="description" content="Počasie pre tvoje miesta, meniny, sviatky a narodeniny.">
<meta name="theme-color" content="#1d4f82">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obzor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Onest:wght@200..700&display=swap">
<style>
/* Layout: jeden stĺpec (max 720 px) nad spodnou lištou; Počasie kreslí vlastnú oblohu cez celú plochu,
   úvodná obrazovka je list trhacieho kalendára. */
:root {
  --paper: #eef2f5;
  --surface: #ffffff;
  --surface-2: #f4f7f9;
  --ink: #132130;
  --ink-2: #536373;
  --line: #d6dee5;
  --accent: #1c6cc0;
  --accent-ink: #ffffff;
  --red: #c42f28;
  --red-soft: rgba(196, 47, 40, .09);
  --bar-bg: rgba(248, 250, 252, .88);
  --bar-line: rgba(19, 33, 48, .1);
  --shadow: 0 1px 2px rgba(19, 33, 48, .06), 0 10px 28px rgba(19, 33, 48, .08);

  /* list trhacieho kalendára je fyzický papier: rovnaký v svetlom aj tmavom režime */
  --cal-paper: #fdfdfb;
  --cal-ink: #17191c;
  --cal-ink-2: #5c6169;
  --cal-red: #c42f28;
  --cal-bind: #6f1b17;

  --font-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Archivo", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --r: 18px;
  --tabbar-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0c1219;
    --surface: #151e28;
    --surface-2: #1b2632;
    --ink: #e5ecf2;
    --ink-2: #95a4b3;
    --line: #26333f;
    --accent: #6db0f2;
    --accent-ink: #06121f;
    --red: #ff6d62;
    --red-soft: rgba(255, 109, 98, .12);
    --bar-bg: rgba(13, 19, 26, .88);
    --bar-line: rgba(255, 255, 255, .08);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
body.mode-wx { background: #1d4f82; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.view-wx :focus-visible { outline-color: #fff; }
h1, h2, h3 { text-wrap: balance; }
.ico { flex: none; display: block; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.view {
  max-width: 720px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 12px) calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
}

/* ---------- spodná lišta ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--bar-bg);
  -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4);
  border-top: 1px solid var(--bar-line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar-inner { display: flex; max-width: 520px; margin: 0 auto; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 9px 4px 8px; border: 0; background: none;
  color: var(--ink-2); font-size: 11.5px; font-weight: 500; letter-spacing: .01em;
}
.tab[aria-current="page"] { color: var(--accent); }
body.mode-wx .tabbar { background: rgba(8, 20, 36, .42); border-top-color: rgba(255, 255, 255, .12); }
body.mode-wx .tab { color: rgba(255, 255, 255, .6); }
body.mode-wx .tab[aria-current="page"] { color: #fff; }

/* ---------- úvodná obrazovka: trhací kalendár ---------- */
.splash {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: var(--paper);
  overflow-y: auto;
  transition: opacity 360ms ease 300ms;
}
.splash.tearing { opacity: 0; pointer-events: none; }
.splash-inner { width: min(360px, 100%); cursor: pointer; }
.splash-hint { text-align: center; color: var(--ink-2); font-size: 12.5px; margin: 22px 0 0; }

.cal-block { position: relative; }
.cal-block::before, .cal-block::after {
  content: ""; position: absolute; left: 7px; right: 7px; height: 100%;
  background: var(--cal-paper); border-radius: 6px;
  box-shadow: 0 1px 3px rgba(20, 30, 40, .12);
}
.cal-block::before { top: 7px; left: 4px; right: 4px; }
.cal-block::after { top: 13px; left: 9px; right: 9px; z-index: -1; opacity: .9; }
.cal-block::before { z-index: 0; }
.cal-page {
  position: relative; z-index: 1;
  background: var(--cal-paper); color: var(--cal-ink);
  border-radius: 6px 6px 5px 5px;
  box-shadow: 0 1px 0 rgba(0, 0, 0, .04), 0 22px 44px rgba(20, 30, 40, .2);
  overflow: hidden;
  transform-origin: 18% 0;
}
.splash.tearing .cal-page {
  transform: translate(-4%, -60px) rotate(-11deg);
  opacity: 0;
  transition: transform 560ms cubic-bezier(.45, 0, .85, .5), opacity 380ms ease 180ms;
}
.cal-bind {
  height: 30px; background: var(--cal-bind);
  display: flex; justify-content: center; align-items: center; gap: 140px;
}
.cal-bind span { width: 11px; height: 11px; border-radius: 50%; background: var(--paper); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .45); }
.cal-perf { height: 0; border-top: 2px dotted rgba(0, 0, 0, .22); margin: 5px 10px 0; }
.cal-head {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 14px 20px 0;
  font: 700 13px/1 var(--font-display); font-stretch: 88%;
  letter-spacing: .16em; text-transform: uppercase;
}
.cal-day {
  font-family: var(--font-display); font-weight: 900; font-stretch: 62%;
  font-size: 172px; line-height: .84; text-align: center; letter-spacing: -.02em;
  margin: 16px 0 0; font-variant-numeric: lining-nums tabular-nums;
}
.cal-dow {
  text-align: center; font: 700 24px/1.1 var(--font-display); font-stretch: 78%;
  letter-spacing: .03em; margin-top: 8px;
}
.cal-red { color: var(--cal-red); }
.cal-hol { text-align: center; color: var(--cal-red); font-weight: 600; font-size: 13.5px; margin: 6px 20px 0; line-height: 1.3; }
.cal-hol small { display: block; color: var(--cal-ink-2); font-weight: 500; font-size: 12px; }
.cal-names { margin: 16px 20px 0; padding: 0; }
.cal-names > div {
  display: grid; grid-template-columns: 5.6em 1fr; gap: 10px; align-items: baseline;
  padding: 9px 0; border-top: 1px solid rgba(0, 0, 0, .09);
}
.cal-names dt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--cal-ink-2); }
.cal-names dd { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.25; min-width: 0; }
.cal-names dd.none { color: var(--cal-ink-2); font-weight: 400; font-size: 15px; }
.cal-bday {
  margin: 12px 20px 0; padding: 10px 12px; border-radius: 8px;
  background: rgba(196, 47, 40, .08); color: var(--cal-ink);
  display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35;
}
.cal-bday .ico { color: var(--cal-red); margin-top: 1px; }
.cal-bday b { font-weight: 650; }
.cal-bday.soft { background: rgba(0, 0, 0, .04); }
.cal-bday.soft .ico { color: var(--cal-ink-2); }
.cal-foot {
  display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 14px 20px 15px; font-size: 11.5px; color: var(--cal-ink-2);
  font-variant-numeric: tabular-nums;
}
.cal-progress { height: 3px; background: rgba(0, 0, 0, .06); }
.cal-progress i { display: block; height: 100%; background: var(--cal-red); transform-origin: left; transform: scaleX(0); }
.splash.run .cal-progress i { animation: fill var(--splash-ms, 4000ms) linear forwards; }
@keyframes fill { to { transform: scaleX(1); } }

/* ---------- Počasie ---------- */
.sky { position: fixed; inset: 0; z-index: -1; background: #1d4f82; }
.view-wx { color: #fff; }
.wx-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 40px;
}
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: rgba(255, 255, 255, .12); color: #fff;
}
.icon-btn:hover { background: rgba(255, 255, 255, .2); }
.icon-btn.spin .ico { animation: spin 900ms linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.dots { display: flex; gap: 7px; align-items: center; justify-content: center; flex-wrap: wrap; min-width: 0; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, .35); }
.dots button[aria-current="true"] { background: #fff; }
.dots .geo { width: 10px; height: 10px; background: none; color: rgba(255, 255, 255, .45); display: grid; place-items: center; }
.dots .geo[aria-current="true"] { color: #fff; background: none; }

.wx-body { display: grid; gap: 12px; margin-top: 4px; }
.hero { text-align: center; padding: 18px 0 14px; text-shadow: 0 1px 12px rgba(0, 20, 40, .18); }
.hero-place { margin: 0; font-size: 30px; font-weight: 500; line-height: 1.15; display: inline-flex; gap: 6px; align-items: center; }
.hero-sub { margin: 4px 0 0; font-size: 13.5px; color: rgba(255, 255, 255, .78); }
.hero-temp { font-size: 104px; font-weight: 200; line-height: 1; margin: 8px 0 0 .12em; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.hero-cond { margin: 4px 0 0; font-size: 19px; font-weight: 500; }
.hero-hl { margin: 3px 0 0; font-size: 16px; color: rgba(255, 255, 255, .88); font-variant-numeric: tabular-nums; }

.banner {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 14px; border-radius: 14px; font-size: 13.5px;
  background: rgba(0, 0, 0, .24); border: 1px solid rgba(255, 255, 255, .16);
}
.banner button { margin-left: auto; border: 0; border-radius: 10px; padding: 6px 12px; background: rgba(255, 255, 255, .9); color: #10263d; font-weight: 600; font-size: 13px; }

.wx-card {
  background: rgba(8, 22, 40, .2);
  border: 1px solid rgba(255, 255, 255, .13);
  border-radius: var(--r);
  padding: 13px 15px 14px;
  -webkit-backdrop-filter: blur(22px) saturate(1.25); backdrop-filter: blur(22px) saturate(1.25);
  min-width: 0;
}
.card-h {
  margin: 0 0 10px; display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em;
  color: rgba(255, 255, 255, .66);
}
.summary { margin: 0 0 12px; padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, .16); font-size: 15px; line-height: 1.4; }

.hours { display: flex; overflow-x: auto; gap: 2px; scrollbar-width: none; margin: 0 -6px; padding: 0 2px; overscroll-behavior-x: contain; }
.hours::-webkit-scrollbar { display: none; }
.hour {
  flex: 0 0 58px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  font-variant-numeric: tabular-nums; padding: 2px 0;
}
.hour-t { font-size: 13.5px; font-weight: 500; }
.hour .wxi { width: 34px; height: 34px; }
.hour-p { font-size: 11.5px; font-weight: 600; color: #9bd6ff; min-height: 15px; }
.hour-temp { font-size: 17px; font-weight: 500; }
.hour.ev .hour-temp { font-size: 12.5px; font-weight: 500; color: rgba(255, 255, 255, .8); padding-top: 3px; }

/* oblačnosť */
.cc-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.cc-now { font-size: 34px; font-weight: 300; line-height: 1; font-variant-numeric: tabular-nums; }
.cc-desc { font-size: 15px; font-weight: 500; }
.cc {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: 112px 18px;
  column-gap: 8px;
}
.cc-plot { position: relative; touch-action: pan-y; cursor: crosshair; }
.cc-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.cc-y { display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: rgba(255, 255, 255, .6); font-variant-numeric: tabular-nums; margin: -6px 0; }
.cc-x { position: relative; font-size: 11px; color: rgba(255, 255, 255, .66); }
.cc-x span { position: absolute; top: 4px; transform: translateX(-50%); white-space: nowrap; }
.cc-x span:first-child { transform: none; }
.cc-x span:last-child { transform: translateX(-100%); }
.cc-cursor { position: absolute; inset: 0; pointer-events: none; }
.cc-line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .55); }
.cc-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(20, 40, 64, .55); }
.cc-tip {
  position: absolute; top: -4px; transform: translate(-50%, -100%);
  background: rgba(8, 20, 36, .82); color: #fff; font-size: 12px; font-weight: 600;
  padding: 4px 8px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.layers { display: grid; gap: 7px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .16); }
.layer { display: grid; grid-template-columns: 7.4em minmax(0, 1fr) 3em; gap: 10px; align-items: center; font-size: 13px; }
.layer small { display: block; font-size: 11px; color: rgba(255, 255, 255, .6); }
.meter { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .16); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: rgba(255, 255, 255, .85); }
.layer .num { text-align: right; font-weight: 600; }

/* 10 dní */
.days { list-style: none; margin: 0; padding: 0; }
.days details { border-top: 1px solid rgba(255, 255, 255, .14); }
.days li:first-child details { border-top: 0; }
.days summary {
  list-style: none; display: grid; grid-template-columns: 3.1em 3.2em 2.4em minmax(0, 1fr) 2.4em;
  gap: 8px; align-items: center; padding: 8px 0; cursor: pointer;
  font-variant-numeric: tabular-nums; font-size: 16px;
}
.days summary::-webkit-details-marker { display: none; }
.d-name { font-weight: 500; }
.d-icon { display: flex; flex-direction: column; align-items: center; line-height: 1; }
.d-icon .wxi { width: 30px; height: 30px; }
.d-icon small { font-size: 10.5px; font-weight: 600; color: #9bd6ff; margin-top: 1px; }
.d-min { text-align: right; color: rgba(255, 255, 255, .66); }
.d-max { text-align: left; font-weight: 500; }
.d-bar { position: relative; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .2); }
.d-bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 5px; }
.d-bar b { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(20, 40, 64, .5); }
.d-more { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 6px 14px; padding: 2px 0 12px; font-size: 13px; color: rgba(255, 255, 255, .85); }
.d-more span b { font-weight: 600; color: #fff; }

/* dlaždice */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; min-height: 158px; }
.tile .card-h { margin-bottom: 8px; }
.tile-main { font-size: 32px; font-weight: 400; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tile-main small { font-size: 16px; font-weight: 500; margin-left: 2px; }
.tile-lvl { font-size: 16px; font-weight: 600; margin-top: 2px; }
.tile-sub { margin: auto 0 0; padding-top: 10px; font-size: 13px; line-height: 1.35; color: rgba(255, 255, 255, .86); }
.scale { position: relative; height: 5px; border-radius: 3px; margin: 10px 0 2px; }
.scale b { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(20, 40, 64, .55); }
.scale.uv { background: linear-gradient(90deg, #5ac85a, #e5d43c 28%, #f29a2e 52%, #e2463b 74%, #9b59c9); }
.scale.aq { background: linear-gradient(90deg, #52b6e8, #56c77b 20%, #e5d43c 40%, #f29a2e 60%, #e2463b 80%, #8e3fa8); }
.compass { width: 100%; max-width: 118px; margin: 0 auto; display: block; }
.sunarc { width: 100%; display: block; margin-top: 4px; }
.moon-row { display: flex; align-items: center; gap: 12px; }
.moon-row svg { width: 50px; height: 50px; flex: none; }

.wx-foot { text-align: center; font-size: 12px; color: rgba(255, 255, 255, .72); margin: 6px 0 0; line-height: 1.5; }
.wx-foot a { color: inherit; }

.wx-empty { text-align: center; padding: 60px 12px; }
.wx-empty h1 { font-size: 26px; font-weight: 500; margin: 0 0 8px; }
.wx-empty p { margin: 0 auto 20px; max-width: 34ch; color: rgba(255, 255, 255, .82); }
.btn-light { border: 0; border-radius: 14px; padding: 12px 20px; background: #fff; color: #10263d; font-weight: 600; }
.skeleton { height: 110px; border-radius: var(--r); background: rgba(255, 255, 255, .1); }

.wxi { display: block; }

/* ---------- spoločné: stránky Narodeniny a Kalendár ---------- */
.page-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 4px; }
.page-h h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 34px; letter-spacing: -.01em; }
.page-sub { margin: 0 0 18px; color: var(--ink-2); font-size: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 12px; padding: 9px 14px; font-weight: 600; font-size: 14px;
}
.btn:hover { border-color: var(--ink-2); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn-danger { color: var(--red); }
.btn-danger.armed { background: var(--red); border-color: var(--red); color: #fff; }
.section-h { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); margin: 26px 0 10px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* narodeniny */
.bd-list { list-style: none; margin: 0; padding: 0; }
.bd-list li + li { border-top: 1px solid var(--line); }
.bd-row {
  width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 12px 14px; border: 0; background: none; text-align: left;
}
.bd-row:hover { background: var(--surface-2); }
.bd-list li:first-child .bd-row { border-radius: var(--r) var(--r) 0 0; }
.bd-list li:last-child .bd-row { border-radius: 0 0 var(--r) var(--r); }
.avatar {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 700; font-size: 15px; color: #fff; letter-spacing: .02em;
}
.bd-name { display: block; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
.bd-meta { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.bd-meta span + span::before { content: " · "; }
.bd-when { text-align: right; font-variant-numeric: tabular-nums; }
.bd-when b { display: block; font-size: 22px; font-weight: 600; line-height: 1.1; font-family: var(--font-display); font-stretch: 80%; }
.bd-when small { font-size: 12px; color: var(--ink-2); }
.bd-row.today { background: var(--red-soft); }
.bd-row.today .bd-when b, .bd-row.today .bd-when small { color: var(--red); }
.bd-row.today:hover { background: var(--red-soft); }

.empty { text-align: center; padding: 34px 20px 30px; }
.empty svg { color: var(--red); }
.empty h2 { margin: 12px 0 6px; font-size: 19px; }
.empty p { margin: 0 auto 18px; max-width: 38ch; color: var(--ink-2); }

.backup { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.backup p { flex-basis: 100%; margin: 0 0 2px; font-size: 13.5px; color: var(--ink-2); }

/* kalendár */
.kal-nav { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 14px 0 0; }
.kal-nav .btn { min-width: 44px; }
.kal-wrap { max-width: 360px; margin: 8px auto 0; }
.search {
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; outline: none; font-size: 16px; }
.search:focus-within { border-color: var(--accent); }
.nd-results { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.nd-results li { padding: 11px 14px; }
.nd-results b { font-size: 16px; }
.nd-results div { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; }
.nd-results .muted { color: var(--ink-2); padding: 6px 2px; background: none; border: 0; box-shadow: none; }
.upcoming { list-style: none; margin: 0; padding: 0; }
.upcoming li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 11px 14px; align-items: start; }
.upcoming li + li { border-top: 1px solid var(--line); }
.up-date { text-align: center; line-height: 1; padding-top: 2px; }
.up-date b { display: block; font-family: var(--font-display); font-weight: 800; font-stretch: 68%; font-size: 30px; font-variant-numeric: tabular-nums; }
.up-date small { font-size: 11.5px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }
.up-date.red b, .up-date.red small { color: var(--red); }
.up-names { font-weight: 600; }
.up-names small { font-weight: 400; color: var(--ink-2); }
.up-extra { font-size: 13px; margin-top: 3px; color: var(--ink-2); }
.up-extra.red { color: var(--red); font-weight: 500; }

/* ---------- vysúvacie okná ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(6, 14, 24, .42); animation: fade 200ms ease; }
.sheet-panel {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px);
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--paper); color: var(--ink);
  border-radius: 22px 22px 0 0;
  padding-inline: 16px;
  padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 20px);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
  animation: rise 260ms cubic-bezier(.2, .8, .2, 1);
}
.sheet-panel::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 8px; }
@media (min-width: 640px) {
  .sheet { align-items: center; padding: 24px; }
  .sheet-panel { border-radius: 22px; max-height: min(760px, 100%); padding-block: 8px 20px; }
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0 12px; position: sticky; top: -8px; background: var(--paper); z-index: 2; }
.sheet-h h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-stretch: 80%; font-size: 26px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-h .actions { display: flex; gap: 8px; flex: none; }
.sheet-h .actions .btn { padding: 8px 12px; }

.geo-btn { width: 100%; margin-top: 10px; }
.results { list-style: none; margin: 10px 0 0; padding: 0; }
.results li + li { border-top: 1px solid var(--line); }
.results button { width: 100%; text-align: left; border: 0; background: none; padding: 11px 14px; display: flex; gap: 10px; align-items: center; }
.results button:hover { background: var(--surface-2); }
.results .r-name { font-weight: 600; }
.results .r-sub { font-size: 13px; color: var(--ink-2); }
.results .r-add { margin-left: auto; color: var(--accent); }
.results .note { padding: 12px 14px; color: var(--ink-2); font-size: 14px; }

.place-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.place-card {
  position: relative; width: 100%; border: 0; text-align: left; color: #fff;
  border-radius: 18px; padding: 13px 15px; min-height: 96px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, .14);
}
.place-card.sel { box-shadow: 0 0 0 3px var(--accent), 0 4px 14px rgba(0, 0, 0, .14); }
.pc-name { font-size: 19px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; }
.pc-sub { font-size: 12.5px; color: rgba(255, 255, 255, .82); }
.pc-cond { align-self: end; font-size: 13.5px; font-weight: 500; }
.pc-temp { font-size: 40px; font-weight: 300; line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
.pc-hl { align-self: end; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
.pc-edit { display: flex; gap: 6px; grid-column: 1 / -1; margin-top: 6px; }
.pc-edit button { border: 0; border-radius: 10px; padding: 6px 10px; background: rgba(255, 255, 255, .22); color: #fff; font-size: 13px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.pc-edit button:disabled { opacity: .35; }
.pc-edit .rm { margin-left: auto; background: rgba(0, 0, 0, .3); }

.form { display: grid; gap: 14px; padding-top: 4px; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field em { font-style: normal; font-weight: 400; }
.field input, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  padding: 11px 12px; font-size: 16px; min-width: 0;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.field-row { display: grid; grid-template-columns: 5em minmax(0, 1fr) 6.2em; gap: 10px; }
.form-err { margin: 0; color: var(--red); font-size: 14px; font-weight: 500; }
.form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 4px; }
.form-actions .spacer { flex: 1; }
.form-hint { margin: 0; font-size: 13px; color: var(--ink-2); }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 14px); z-index: 90;
  transform: translateX(-50%); max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 14px;
  background: #16232f; color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 14px;
  box-shadow: 0 8px 26px rgba(0, 0, 0, .3); animation: rise 220ms ease;
}
.toast button { border: 0; background: none; color: #8cc4ff; font-weight: 700; padding: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .splash.run .cal-progress i { animation-duration: var(--splash-ms, 4000ms) !important; }
  .splash.tearing .cal-page { transform: none; }
}
@media (max-width: 380px) {
  .hero-temp { font-size: 88px; }
  .cal-day { font-size: 150px; }
  .field-row { grid-template-columns: 4.6em minmax(0, 1fr); }
  .field-row .field:last-child { grid-column: 1 / -1; }
  .days summary { grid-template-columns: 2.8em 2.9em 2.2em minmax(0, 1fr) 2.2em; gap: 6px; }
}
</style>
</head>

    <div id="bd-content"></div>
    <h2 class="section-h">Záloha</h2>

  <section id="view-kalendar" class="view" aria-label="Kalendár" hidden>

    <label class="search" for="nd-q">
      <span id="nd-ico"></span>
      <input id="nd-q" type="search" placeholder="Napíš meno, napr. Katarína" autocomplete="off" enterkeyhint="search">

    <ul class="nd-results" id="nd-results"></ul>
    <h2 class="section-h">Najbližších 14 dní</h2>
    <ol class="upcoming panel" id="kal-upcoming"></ol>
  </section>
</main>

</nav>

/* ============================================================
   Kalendár: meniny, svátky, sviatky, Veľká noc
   ============================================================ */
const Kal = {
  easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return new Date(y, month - 1, day);
  },
  _hol: {},
  holidays(y) {
    if (this._hol[y]) return this._hol[y];
    const sk = { ...SVIATKY_SK }, cz = { ...SVATKY_STATNI_CZ };
    const e = this.easter(y);
    sk[mmdd(addDays(e, -2))] = 'Veľký piatok';
    sk[mmdd(e)] = 'Veľkonočná nedeľa';
    sk[mmdd(addDays(e, 1))] = 'Veľkonočný pondelok';
    cz[mmdd(addDays(e, -2))] = 'Velký pátek';
    cz[mmdd(e)] = 'Velikonoční neděle';
    cz[mmdd(addDays(e, 1))] = 'Velikonoční pondělí';
    return (this._hol[y] = { sk, cz });
  },
  forDate(d) {
    const m = d.getMonth(), day = d.getDate() - 1, key = mmdd(d);
    const hol = this.holidays(d.getFullYear());
    return {
      sk: MENINY_SK[m][day] || '',
      cz: SVATKY_CZ[m][day] || '',
      skHol: hol.sk[key] || '',
      czHol: hol.cz[key] || ''
    };
  },
  _index: null,
  index() {
    if (this._index) return this._index;
    const idx = new Map();
    const add = (list, country) => list.forEach((month, m) => month.forEach((str, d) => {
      if (!str) return;
      str.split(',').map((s) => s.trim()).filter(Boolean).forEach((name) => {
        const k = norm(name);
        if (!idx.has(k)) idx.set(k, { name, sk: [], cz: [] });
        idx.get(k)[country].push({ m: m + 1, d: d + 1 });
      });
    }));
    add(MENINY_SK, 'sk');
    add(SVATKY_CZ, 'cz');
    return (this._index = idx);
  },
  lookup(firstName) { return this.index().get(norm(firstName)) || null; },
  search(q) {
    const nq = norm(q);
    if (nq.length < 2) return [];
    const starts = [], contains = [];
    for (const [k, v] of this.index()) {
      if (k.startsWith(nq)) starts.push(v); else if (k.includes(nq)) contains.push(v);
    }
    const byName = (a, b) => a.name.localeCompare(b.name, 'sk');
    return [...starts.sort(byName), ...contains.sort(byName)].slice(0, 12);
  }
};

}

/** Farba teploty pre pásiky v 10-dňovej predpovedi */
const T_STOPS = [[-15, [138, 125, 255]], [-5, [90, 168, 255]], [5, [89, 210, 232]], [13, [143, 220, 138]], [20, [243, 214, 90]], [27, [255, 159, 67]], [35, [255, 91, 79]]];
function tempColor(t) {
  if (t <= T_STOPS[0][0]) return `rgb(${T_STOPS[0][1]})`;
  for (let i = 1; i < T_STOPS.length; i++) {
    const [t1, c1] = T_STOPS[i];
    if (t <= t1) {
      const [t0, c0] = T_STOPS[i - 1], f = (t - t0) / (t1 - t0);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f)).join(',')})`;

  }
  return `rgb(${T_STOPS[T_STOPS.length - 1][1]})`;
}

const dirIdx = (deg) => Math.round(((deg % 360) + 360) % 360 / 22.5) % 16;

const hhmm = (iso) => iso.slice(11, 16).replace(/^0/, '');
const hourOf = (iso) => +iso.slice(11, 13);
const minutesOf = (iso) => +iso.slice(11, 13) * 60 + +iso.slice(14, 16);

function cloudWord(p) {
  if (p < 10) return 'Jasno';
  if (p < 35) return 'Malá oblačnosť';
  if (p < 65) return 'Polojasno';
  if (p < 90) return 'Oblačno';
  return 'Zamračené';
}
function uvLevel(u) {
  if (u < 3) return ['Nízky', 'Ochrana nie je potrebná.'];
  if (u < 6) return ['Stredný', 'Na poludnie použi opaľovací krém.'];
  if (u < 8) return ['Vysoký', 'Okolo obeda vyhľadaj tieň.'];
  if (u < 11) return ['Veľmi vysoký', 'Obmedz pobyt na slnku.'];
  return ['Extrémny', 'Vyhni sa priamemu slnku.'];
}
function aqLevel(v) {
  if (v <= 20) return 'Dobrá';
  if (v <= 40) return 'Prijateľná';
  if (v <= 60) return 'Stredná';
  if (v <= 80) return 'Zlá';
  if (v <= 100) return 'Veľmi zlá';
  return 'Extrémne zlá';
}

/* Fáza Mesiaca – počítaná lokálne */
function moonPhase(date = new Date()) {
  const SYN = 29.530588853, ref = Date.UTC(2000, 0, 6, 18, 14);
  let p = ((date - ref) / DAY / SYN) % 1;
  if (p < 0) p += 1;
  const names = [[0.0339, 'Nov'], [0.216, 'Dorastajúci kosák'], [0.284, 'Prvá štvrť'], [0.466, 'Dorastajúci Mesiac'], [0.534, 'Spln'], [0.716, 'Ubúdajúci Mesiac'], [0.784, 'Posledná štvrť'], [0.9661, 'Ubúdajúci kosák'], [1.01, 'Nov']];
  const name = names.find(([lim]) => p < lim)[1];
  const illum = (1 - Math.cos(2 * Math.PI * p)) / 2;
  const toFull = ((0.5 - p + 1) % 1) * SYN;
  return { p, name, illum, toFull: Math.round(toFull) };
}
function moonSVG(p) {
  const r = 22, cx = 25, cy = 25, k = Math.cos(2 * Math.PI * p), rx = (Math.abs(k) * r).toFixed(2);
  const waxing = p < 0.5;
  const limb = waxing ? 1 : 0;
  const term = waxing ? (k > 0 ? 0 : 1) : (k > 0 ? 1 : 0);
  const lit = `M${cx} ${cy - r} A${r} ${r} 0 0 ${limb} ${cx} ${cy + r} A${rx} ${r} 0 0 ${term} ${cx} ${cy - r}Z`;
  return `<svg viewBox="0 0 50 50" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="${r}" fill="rgba(255,255,255,.14)"/><path d="${lit}" fill="#F2EEDC"/></svg>`;
}

/* ============================================================
   Počasie – dáta a zobrazenie
   ============================================================ */
const WX_TTL = 10 * 60 * 1000;
const DEFAULT_PLACES = [{ id: 'g3060972', name: 'Bratislava', admin: 'Bratislavský kraj', country: 'Slovensko', lat: 48.14816, lon: 17.10674 }];

async function fetchForecast(p) {
  const q = new URLSearchParams({
    latitude: p.lat, longitude: p.lon, timezone: 'auto', forecast_days: 10, wind_speed_unit: 'kmh',
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    hourly: 'temperature_2m,precipitation_probability,precipitation,weather_code,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,visibility,uv_index,is_day,dew_point_2m,pressure_msl',
    daily: 'weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,daylight_duration,uv_index_max,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,wind_direction_10m_dominant'
  });
  const r = await fetch('https://api.open-meteo.com/v1/forecast?' + q);
  if (!r.ok) throw new Error('Server počasia odpovedal chybou ' + r.status);
  return r.json();
}
async function fetchAir(p) {
  const q = new URLSearchParams({ latitude: p.lat, longitude: p.lon, timezone: 'auto', current: 'european_aqi,pm2_5,pm10' });
  const r = await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?' + q);
  if (!r.ok) throw new Error('AQ ' + r.status);
  return r.json();
}
async function searchPlaces(name) {
  const q = new URLSearchParams({ name, count: 8, language: 'sk', format: 'json' });
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?' + q);
  if (!r.ok) throw new Error('Vyhľadávanie zlyhalo');
  return (await r.json()).results || [];
}

const Wx = {
  places: [], sel: 0, cache: {}, pending: {}, errors: {},

  init() {
    const saved = store.get('places', null);
    this.places = Array.isArray(saved) ? saved : DEFAULT_PLACES.slice();
    this.sel = clamp(store.get('sel', 0) | 0, 0, Math.max(0, this.places.length - 1));
    for (const p of this.places) { const c = store.get('wx.' + p.id, null); if (c && c.data) this.cache[p.id] = c; }

    $('#wx-places').innerHTML = ico('list', 22);
    $('#wx-refresh').innerHTML = ico('refresh', 21);
    $('#wx-places').addEventListener('click', () => Places.open());
    $('#wx-refresh').addEventListener('click', () => this.refreshAll(true));
    this.bindSwipe();
  },
  save() { store.set('places', this.places); store.set('sel', this.sel); },
  current() { return this.places[this.sel] || null; },

  select(i) {
    if (!this.places.length) return;
    this.sel = (i + this.places.length) % this.places.length;
    this.save();
    this.render();
    window.scrollTo({ top: 0 });
    this.load(this.current()).then(() => this.render());
  },

  load(p, force = false) {
    if (!p) return Promise.resolve();
    const c = this.cache[p.id];
    if (!force && c && Date.now() - c.at < WX_TTL) return Promise.resolve();
    if (this.pending[p.id]) return this.pending[p.id];
    const job = (async () => {
      try {
        const [data, aq] = await Promise.all([fetchForecast(p), fetchAir(p).catch(() => null)]);
        this.cache[p.id] = { data, aq, at: Date.now() };
        delete this.errors[p.id];
        store.set('wx.' + p.id, this.cache[p.id]);
      } catch (e) {
        this.errors[p.id] = (e && e.message) || 'Neznáma chyba';
      } finally {
        delete this.pending[p.id];
      }
    })();
    this.pending[p.id] = job;
    return job;
  },

  async refreshAll(force = false) {
    const btn = $('#wx-refresh');
    btn.classList.add('spin');
    const cur = this.current();
    const first = this.load(cur, force);
    this.render();
    await first;
    this.render();
    await Promise.allSettled(this.places.map((p) => this.load(p, force)));
    btn.classList.remove('spin');
    this.render();
    Places.renderList();
  },

  bindSwipe() {
    const body = $('#view-pocasie');
    let sx = 0, sy = 0, ok = false;
    body.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      ok = !e.target.closest('.hours, .cc-plot, details[open] .d-more') && e.touches.length === 1;
      sx = t.clientX; sy = t.clientY;
    }, { passive: true });
    body.addEventListener('touchend', (e) => {
      if (!ok || this.places.length < 2) return;
      const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) this.select(this.sel + (dx < 0 ? 1 : -1));
    }, { passive: true });
    document.addEventListener('keydown', (e) => {
      if (App.tab !== 'pocasie' || $('#sheet-root').firstChild || !$('#splash').hidden) return;
      if (e.target.closest('input, textarea, select')) return;
      if (e.key === 'ArrowRight') this.select(this.sel + 1);
      if (e.key === 'ArrowLeft') this.select(this.sel - 1);
    });
  },

  renderDots() {
    const dots = $('#wx-dots');
    if (this.places.length < 2) { dots.innerHTML = ''; return; }
    dots.innerHTML = this.places.map((p, i) =>
      `<button role="tab" class="${p.geo ? 'geo' : ''}" aria-current="${i === this.sel}" aria-label="${esc(p.name)}" data-i="${i}">${p.geo ? ico('pin', 11, 2.4) : ''}</button>`).join('');
    $$('button', dots).forEach((b) => b.addEventListener('click', () => this.select(+b.dataset.i)));
  },

  render() {
    this.renderDots();
    const body = $('#wx-body'), sky = $('#sky');
    const p = this.current();
    if (!p) {
      sky.style.background = skyFor(1, true);
      body.innerHTML = `<div class="wx-empty"><h1>Zatiaľ žiadne miesto</h1><p>Pridaj mestá, ktoré chceš sledovať. Počasie sa zobrazí pre každé z nich.</p><button class="btn-light" id="wx-add-first">Pridať miesto</button></div>`;
      $('#wx-add-first').addEventListener('click', () => Places.open(true));
      return;
    }
    const c = this.cache[p.id];
    const err = this.errors[p.id];
    if (!c) {
      sky.style.background = skyFor(2, true);
      body.innerHTML = `<section class="hero"><h1 class="hero-place">${esc(p.name)}</h1><p class="hero-sub">${err ? '' : 'Načítavam počasie…'}</p></section>` +
        (err
          ? `<div class="banner">Počasie sa nepodarilo načítať. Skontroluj pripojenie na internet.<button id="wx-retry">Skúsiť znova</button></div>`
          : '<div class="skeleton"></div><div class="skeleton"></div>');
      if (err) $('#wx-retry').addEventListener('click', () => this.refreshAll(true));
      return;
    }
    body.innerHTML = this.detailHTML(p, c, err);
    sky.style.background = skyFor(c.data.current.weather_code, c.data.current.is_day === 1);
    const retry = $('#wx-retry');
    if (retry) retry.addEventListener('click', () => this.refreshAll(true));
    this.bindCloudChart(c.data);
  },

  detailHTML(p, c, err) {
    const d = c.data, cur = d.current, h = d.hourly, dl = d.daily;
    let i0 = h.time.indexOf(cur.time.slice(0, 13) + ':00');
    if (i0 < 0) i0 = 0;
    const T = (v) => Math.round(v);
    const localOffset = -new Date().getTimezoneOffset() * 60;
    const placeNow = new Date(Date.now() + d.utc_offset_seconds * 1000);
    const timeThere = placeNow.getUTCHours() + ':' + pad(placeNow.getUTCMinutes());
    const sub = d.utc_offset_seconds !== localOffset
      ? `Miestny čas ${timeThere}` + (p.admin ? ' · ' + esc(p.admin) : '')
      : esc([p.admin, p.country].filter(Boolean).join(', '));

    let html = '';
    const ageMin = Math.round((Date.now() - c.at) / 60000);
    if (err && ageMin > 15) {
      html += `<div class="banner">Bez pripojenia – zobrazujem údaje spred ${ageMin < 90 ? ageMin + ' min' : Math.round(ageMin / 60) + ' h'}.<button id="wx-retry">Skúsiť znova</button></div>`;
    }

    // Hlavička
    html += `<section class="hero">
      <h1 class="hero-place">${p.geo ? ico('pin', 18, 2.2) : ''}${esc(p.name)}</h1>
      <p class="hero-sub">${sub}</p>
      <div class="hero-temp">${T(cur.temperature_2m)}°</div>
      <p class="hero-cond">${wxText(cur.weather_code)}</p>
      <p class="hero-hl">Max. ${T(dl.temperature_2m_max[0])}° · Min. ${T(dl.temperature_2m_min[0])}°</p>
    </section>`;

    // Hodinová predpoveď
    html += `<section class="wx-card"><p class="summary">${esc(this.summary(d, i0))}</p><div class="hours" aria-label="Predpoveď na 24 hodín">${this.hoursHTML(d, i0)}</div></section>`;

    // Oblačnosť
    html += this.cloudHTML(d, i0);

    // 10 dní
    html += this.daysHTML(d);

    // Dlaždice
    html += `<div class="tiles">${this.tilesHTML(d, c.aq, i0)}</div>`;

    const at = new Date(c.at);
    html += `<p class="wx-foot">Aktualizované ${at.getHours()}:${pad(at.getMinutes())} · Údaje: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></p>`;
    return html;
  },

  summary(d, i0) {
    const h = d.hourly, cur = d.current, dl = d.daily;
    let first = '';
    const end = Math.min(h.time.length, i0 + 12);
    if (isWet(cur.weather_code) || cur.precipitation > 0) {
      for (let i = i0 + 1; i < end; i++) {
        if (!isWet(h.weather_code[i]) && (h.precipitation_probability[i] ?? 0) < 40) { first = `Zrážky by mali ustať okolo ${hhmm(h.time[i])}.`; break; }
      }
      if (!first) first = 'Zrážky budú pokračovať aj v najbližších hodinách.';
    } else {
      for (let i = i0 + 1; i < end; i++) {
        if (isWet(h.weather_code[i]) && (h.precipitation_probability[i] ?? 0) >= 40) {
          first = `Okolo ${hhmm(h.time[i])} sa očakávajú zrážky (${h.precipitation_probability[i]} %).`; break;
        }
      }
    }
    let day = `Dnes ${wxText(dl.weather_code[0]).toLowerCase()}, najvyššia teplota ${Math.round(dl.temperature_2m_max[0])}°.`;
    if (dl.wind_gusts_10m_max[0] >= 50) day += ` Nárazy vetra až ${Math.round(dl.wind_gusts_10m_max[0])} km/h.`;
    return [first, day].filter(Boolean).join(' ');
  },

  hoursHTML(d, i0) {
    const h = d.hourly, dl = d.daily;
    const end = Math.min(h.time.length - 1, i0 + 24);
    const events = [];
    dl.sunrise.forEach((t) => events.push({ t, rise: true }));
    dl.sunset.forEach((t) => events.push({ t, rise: false }));
    let out = '';
    for (let i = i0; i <= end; i++) {
      const pp = h.precipitation_probability[i];
      const temp = i === i0 ? d.current.temperature_2m : h.temperature_2m[i];
      const code = i === i0 ? d.current.weather_code : h.weather_code[i];
      const isDay = i === i0 ? d.current.is_day : h.is_day[i];
      out += `<div class="hour"><span class="hour-t">${i === i0 ? 'Teraz' : hourOf(h.time[i]) + ':00'}</span>${wxIcon(code, isDay === 1)}<span class="hour-p">${pp >= 20 ? pp + ' %' : ''}</span><span class="hour-temp">${Math.round(temp)}°</span></div>`;
      const hourKey = h.time[i].slice(0, 13);
      events.filter((e) => e.t && e.t.slice(0, 13) === hourKey && (i > i0 || minutesOf(e.t) >= minutesOf(d.current.time)))
        .forEach((e) => {
          out += `<div class="hour ev"><span class="hour-t">${hhmm(e.t)}</span>${sunEventIcon(e.rise)}<span class="hour-p"></span><span class="hour-temp">${e.rise ? 'Východ' : 'Západ'}</span></div>`;
        });
    }
    return out;
  },

  cloudHTML(d, i0) {
    const h = d.hourly, n = 24;
    const vals = [];
    for (let k = 0; k <= n; k++) vals.push(h.cloud_cover[Math.min(h.time.length - 1, i0 + k)] ?? 0);
    vals[0] = d.current.cloud_cover ?? vals[0];
    const W = 300, H = 100;
    const pts = vals.map((v, k) => [(k / n) * W, H - (clamp(v, 0, 100) / 100) * H]);
    const line = 'M' + pts.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join('L');
    const area = line + `L${W},${H}L0,${H}Z`;
    const labels = [0, 6, 12, 18, 24].map((k) => {
      const t = h.time[Math.min(h.time.length - 1, i0 + k)];
      return `<span style="left:${(k / n) * 100}%">${k === 0 ? 'Teraz' : hourOf(t) + ':00'}</span>`;
    }).join('');
    const now = Math.round(vals[0]);
    const low = h.cloud_cover_low[i0] ?? 0, mid = h.cloud_cover_mid[i0] ?? 0, high = h.cloud_cover_high[i0] ?? 0;
    const layer = (name, hint, v) => `<div class="layer"><span>${name}<small>${hint}</small></span><span class="meter"><i style="width:${clamp(v, 0, 100)}%"></i></span><span class="num">${Math.round(v)} %</span></div>`;
    const times = [];
    for (let k = 0; k <= n; k++) times.push(k === 0 ? 'Teraz' : hhmm(h.time[Math.min(h.time.length - 1, i0 + k)]));
    this._cc = { vals, times };
    return `<section class="wx-card">
      <h2 class="card-h">${ico('cloud', 15, 2)}Oblačnosť</h2>
      <div class="cc-top"><span class="cc-now">${now} %</span><span class="cc-desc">${cloudWord(now)}</span></div>
      <div class="cc" aria-label="Oblačnosť na najbližších 24 hodín">
        <div class="cc-plot" id="cc-plot">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
            <g stroke="rgba(255,255,255,.18)" stroke-width="1" vector-effect="non-scaling-stroke">
              <line x1="0" y1="0" x2="${W}" y2="0" vector-effect="non-scaling-stroke"/>
              <line x1="0" y1="50" x2="${W}" y2="50" vector-effect="non-scaling-stroke" stroke-dasharray="3 4"/>
              <line x1="0" y1="${H}" x2="${W}" y2="${H}" vector-effect="non-scaling-stroke"/>
            </g>
            <path d="${area}" fill="rgba(255,255,255,.2)"/>
            <path d="${line}" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
          </svg>
          <div class="cc-cursor" hidden><i class="cc-line"></i><i class="cc-dot"></i><span class="cc-tip"></span></div>
        </div>
        <div class="cc-y"><span>100 %</span><span>50 %</span><span>0 %</span></div>
        <div class="cc-x">${labels}</div>
      </div>
      <div class="layers">
        ${layer('Nízka', 'do 2 km', low)}
        ${layer('Stredná', '2 – 6 km', mid)}
        ${layer('Vysoká', 'nad 6 km', high)}
      </div>
    </section>`;
  },

  bindCloudChart() {
    const plot = $('#cc-plot');
    if (!plot || !this._cc) return;
    const { vals, times } = this._cc;
    const cursor = $('.cc-cursor', plot), lineEl = $('.cc-line', plot), dot = $('.cc-dot', plot), tip = $('.cc-tip', plot);
    const n = vals.length - 1;
    const show = (clientX) => {
      const r = plot.getBoundingClientRect();
      const k = clamp(Math.round(((clientX - r.left) / r.width) * n), 0, n);
      const x = (k / n) * r.width, y = r.height - (clamp(vals[k], 0, 100) / 100) * r.height;
      cursor.hidden = false;
      lineEl.style.left = x + 'px';
      dot.style.left = x + 'px'; dot.style.top = y + 'px';
      tip.textContent = `${times[k]} · ${Math.round(vals[k])} %`;
      const tw = tip.offsetWidth / 2;
      tip.style.left = clamp(x, tw, r.width - tw) + 'px';
    };
    plot.addEventListener('pointermove', (e) => show(e.clientX));
    plot.addEventListener('pointerdown', (e) => show(e.clientX));
    plot.addEventListener('pointerleave', () => { cursor.hidden = true; });
  },

  daysHTML(d) {
    const dl = d.daily;
    const n = dl.time.length;
    const lo = Math.min(...dl.temperature_2m_min), hi = Math.max(...dl.temperature_2m_max);
    const span = Math.max(1, hi - lo);
    let rows = '';
    for (let i = 0; i < n; i++) {
      const date = new Date(dl.time[i] + 'T12:00:00');
      const name = i === 0 ? 'Dnes' : DNI_KR[date.getDay()];
      const mn = dl.temperature_2m_min[i], mx = dl.temperature_2m_max[i];
      const left = ((mn - lo) / span) * 100, width = ((mx - mn) / span) * 100;
      const pp = dl.precipitation_probability_max[i];
      const dot = i === 0 ? `<b style="left:${clamp(((d.current.temperature_2m - lo) / span) * 100, 0, 100)}%"></b>` : '';
      const wind = dl.wind_direction_10m_dominant[i];
      rows += `<li><details><summary aria-label="${esc(DNI[date.getDay()])} ${date.getDate()}. ${MESIACE_GEN[date.getMonth()]}: ${wxText(dl.weather_code[i])}, ${Math.round(mn)} až ${Math.round(mx)} °C">
        <span class="d-name">${name}</span>
        <span class="d-icon">${wxIcon(dl.weather_code[i], true)}<small>${pp >= 20 ? pp + ' %' : ''}</small></span>
        <span class="d-min">${Math.round(mn)}°</span>
        <span class="d-bar"><i style="left:${left}%;width:${width}%;background:linear-gradient(90deg, ${tempColor(mn)}, ${tempColor(mx)})"></i>${dot}</span>
        <span class="d-max">${Math.round(mx)}°</span>
      </summary>
      <div class="d-more">
        <span>${esc(DNI[date.getDay()])} ${date.getDate()}. ${MESIACE_GEN[date.getMonth()]}</span>
        <span>${wxText(dl.weather_code[i])}</span>
        <span>Zrážky <b>${fmtNum(dl.precipitation_sum[i])} mm</b>${pp != null ? ` (${pp} %)` : ''}</span>
        <span>Vietor <b>${Math.round(dl.wind_speed_10m_max[i])} km/h</b> ${wind != null ? SMERY[dirIdx(wind)] : ''}</span>
        <span>Nárazy <b>${Math.round(dl.wind_gusts_10m_max[i])} km/h</b></span>
        <span>UV index <b>${fmtNum(dl.uv_index_max[i], 0)}</b></span>
        <span>Východ <b>${hhmm(dl.sunrise[i])}</b> · západ <b>${hhmm(dl.sunset[i])}</b></span>
      </div></details></li>`;
    }
    return `<section class="wx-card"><h2 class="card-h">${ico('calendar', 15, 2)}Predpoveď na ${n} dní</h2><ol class="days">${rows}</ol></section>`;
  },

  tilesHTML(d, aq, i0) {
    const cur = d.current, h = d.hourly, dl = d.daily;
    const T = (v) => Math.round(v);
    const tile = (icon, title, body) => `<section class="wx-card tile"><h2 class="card-h">${ico(icon, 15, 2)}${title}</h2>${body}</section>`;
    const out = [];

    // Pocitová teplota
    const diff = cur.apparent_temperature - cur.temperature_2m;
    const feelTxt = diff <= -2 ? 'Vietor spôsobuje, že je chladnejšie.' : diff >= 2 ? 'Vlhkosť spôsobuje, že je teplejšie.' : 'Podobná ako skutočná teplota.';
    out.push(tile('thermo', 'Pocitová teplota', `<div class="tile-main">${T(cur.apparent_temperature)}°</div><p class="tile-sub">${feelTxt}</p>`));

    // Vietor
    const wdir = cur.wind_direction_10m, wi = dirIdx(wdir);
    const compass = `<svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="40" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
      ${Array.from({ length: 36 }, (_, k) => { const a = (k * 10 * Math.PI) / 180, r1 = k % 9 === 0 ? 33 : 36; return `<line x1="${(50 + Math.sin(a) * r1).toFixed(1)}" y1="${(50 - Math.cos(a) * r1).toFixed(1)}" x2="${(50 + Math.sin(a) * 40).toFixed(1)}" y2="${(50 - Math.cos(a) * 40).toFixed(1)}" stroke="rgba(255,255,255,${k % 9 === 0 ? '.8' : '.3'})" stroke-width="1"/>`; }).join('')}
      <g font-size="9" font-weight="600" fill="rgba(255,255,255,.75)" text-anchor="middle" font-family="Onest, system-ui, sans-serif"><text x="50" y="23">S</text><text x="80" y="53">V</text><text x="50" y="84">J</text><text x="20" y="53">Z</text></g>
      <g transform="rotate(${(wdir + 180) % 360} 50 50)"><line x1="50" y1="78" x2="50" y2="26" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/><path d="M50 20l-6 10h12z" fill="#fff"/><circle cx="50" cy="78" r="3.5" fill="none" stroke="#fff" stroke-width="2"/></g>
      <circle cx="50" cy="50" r="13" fill="rgba(12,28,48,.75)"/>
      <text x="50" y="50" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" font-family="Onest, system-ui, sans-serif">${T(cur.wind_speed_10m)}</text>
      <text x="50" y="59" font-size="6.5" fill="rgba(255,255,255,.8)" text-anchor="middle" font-family="Onest, system-ui, sans-serif">km/h</text>
    </svg>`;
    out.push(tile('wind', 'Vietor', `${compass}<p class="tile-sub">${SMERY_SLOVOM[wi][0].toUpperCase() + SMERY_SLOVOM[wi].slice(1)} (${SMERY[wi]}), nárazy ${T(cur.wind_gusts_10m)} km/h.</p>`));

    // UV index
    const uvNow = h.uv_index[i0] ?? 0, uvMax = dl.uv_index_max[0] ?? 0;
    const [uvName, uvTip] = uvLevel(uvNow);
    out.push(tile('sun', 'UV index', `<div class="tile-main">${fmtNum(uvNow, 0)}</div><div class="tile-lvl">${uvName}</div><div class="scale uv" role="img" aria-label="UV ${fmtNum(uvNow, 0)} z 11"><b style="left:${clamp((uvNow / 11) * 100, 0, 100)}%"></b></div><p class="tile-sub">Dnes najviac ${fmtNum(uvMax, 0)}. ${uvTip}</p>`));

    // Slnko
    const sr = dl.sunrise[0], ss = dl.sunset[0];
    const nowMin = minutesOf(cur.time);
    const t = (nowMin - minutesOf(sr)) / Math.max(1, minutesOf(ss) - minutesOf(sr));
    let arc = '';
    for (let k = 0; k <= 40; k++) { const u = k / 40; arc += (k ? 'L' : 'M') + (8 + 104 * u).toFixed(1) + ',' + (46 - 34 * Math.sin(Math.PI * u)).toFixed(1); }
    const sunDot = t >= 0 && t <= 1 ? `<circle cx="${(8 + 104 * t).toFixed(1)}" cy="${(46 - 34 * Math.sin(Math.PI * t)).toFixed(1)}" r="5" fill="#FFC23A" stroke="rgba(20,40,64,.5)" stroke-width="2"/>` : '';
    const daylen = dl.daylight_duration[0] ? `${Math.floor(dl.daylight_duration[0] / 3600)} h ${Math.round((dl.daylight_duration[0] % 3600) / 60)} min` : '';
    const nextSun = nowMin < minutesOf(sr) ? ['Východ slnka', hhmm(sr), `Západ ${hhmm(ss)}`] : nowMin < minutesOf(ss) ? ['Západ slnka', hhmm(ss), `Východ ${hhmm(sr)}`] : ['Východ slnka', hhmm(dl.sunrise[1] || sr), `Dnes západ ${hhmm(ss)}`];
    out.push(tile(nextSun[0].startsWith('Západ') ? 'sunset' : 'sunrise', nextSun[0], `<div class="tile-main">${nextSun[1]}</div>
      <svg class="sunarc" viewBox="0 0 120 52" aria-hidden="true"><line x1="0" y1="46" x2="120" y2="46" stroke="rgba(255,255,255,.35)" stroke-width="1"/><path d="${arc}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-dasharray="3 3"/>${sunDot}</svg>
      <p class="tile-sub">${nextSun[2]}${daylen ? ` · deň trvá ${daylen}` : ''}</p>`));

    // Zrážky
    const rainToday = dl.precipitation_sum[0] ?? 0, rainTom = dl.precipitation_sum[1] ?? 0;
    out.push(tile('rain', 'Zrážky', `<div class="tile-main">${fmtNum(rainToday)}<small>mm</small></div><div class="tile-lvl">dnes</div><p class="tile-sub">${rainTom > 0.05 ? `Zajtra sa očakáva ${fmtNum(rainTom)} mm (${dl.precipitation_probability_max[1] ?? 0} %).` : 'Zajtra sa zrážky neočakávajú.'}</p>`));

    // Vlhkosť
    const dew = h.dew_point_2m[i0];
    out.push(tile('drop', 'Vlhkosť', `<div class="tile-main">${T(cur.relative_humidity_2m)} %</div><p class="tile-sub">Rosný bod je teraz ${dew != null ? T(dew) + '°' : '–'}.</p>`));

    // Viditeľnosť
    const vis = (h.visibility[i0] ?? 0) / 1000;
    const visTxt = vis >= 10 ? 'Výborná viditeľnosť.' : vis >= 4 ? 'Dobrá viditeľnosť.' : vis >= 1 ? 'Zhoršená viditeľnosť.' : 'Veľmi zlá viditeľnosť, hmla.';
    out.push(tile('eye', 'Viditeľnosť', `<div class="tile-main">${vis >= 10 ? Math.round(vis) : fmtNum(vis)}<small>km</small></div><p class="tile-sub">${visTxt}</p>`));

    // Tlak
    const pNow = cur.pressure_msl, pLater = h.pressure_msl[Math.min(h.time.length - 1, i0 + 3)];
    const pd = pLater - pNow;
    const pTrend = pd > 0.8 ? 'Tlak stúpa.' : pd < -0.8 ? 'Tlak klesá.' : 'Tlak je stabilný.';
    out.push(tile('gauge', 'Tlak vzduchu', `<div class="tile-main">${Math.round(pNow)}<small>hPa</small></div><p class="tile-sub">${pTrend}</p>`));

    // Kvalita ovzdušia
    const aqi = aq && aq.current ? aq.current.european_aqi : null;
    out.push(tile('leaf', 'Kvalita ovzdušia', aqi != null
      ? `<div class="tile-main">${Math.round(aqi)}</div><div class="tile-lvl">${aqLevel(aqi)}</div><div class="scale aq" role="img" aria-label="Index ${Math.round(aqi)} zo 100"><b style="left:${clamp(aqi, 0, 100)}%"></b></div><p class="tile-sub">PM2,5: ${fmtNum(aq.current.pm2_5)} µg/m³ · PM10: ${fmtNum(aq.current.pm10)} µg/m³</p>`
      : `<p class="tile-sub">Údaje o kvalite ovzdušia teraz nie sú dostupné.</p>`));

    // Mesiac
    const mp = moonPhase();
    out.push(tile('moon', 'Mesiac', `<div class="moon-row">${moonSVG(mp.p)}<div><div class="tile-lvl">${mp.name}</div><div class="num">${Math.round(mp.illum * 100)} % osvetlený</div></div></div><p class="tile-sub">${mp.toFull === 0 || mp.name === 'Spln' ? 'Dnes je spln.' : `Spln o ${mp.toFull} ${plural(mp.toFull, 'deň', 'dni', 'dní')}.`}</p>`));

    return out.join('');
  }
};

/* ---------- Správa miest ---------- */
const Places = {
  editing: false, q: '', results: [], searching: false, searchErr: '', timer: 0,

  open(focusSearch = false) {
    this.editing = false; this.q = ''; this.results = []; this.searchErr = '';
    Sheet.open(`
      <div class="sheet-h"><h2 id="pl-title">Moje miesta</h2><div class="actions"><button class="btn" id="pl-edit">Upraviť</button><button class="btn btn-primary" data-close>Hotovo</button></div></div>
      <label class="search" for="pl-q">${ico('search', 18)}<input id="pl-q" type="search" placeholder="Hľadať mesto alebo obec" autocomplete="off" enterkeyhint="search"></label>
      <ul class="results panel" id="pl-results" hidden></ul>
      <button class="btn geo-btn" id="pl-geo">${ico('pin', 16, 2)}Pridať moju polohu</button>
      <ul class="place-list" id="pl-list"></ul>
    `, { label: 'pl-title', onClose: () => { Wx.render(); } });
    const input = $('#pl-q');
    input.addEventListener('input', () => this.onQuery(input.value));
    $('#pl-edit').addEventListener('click', (e) => { this.editing = !this.editing; e.currentTarget.textContent = this.editing ? 'Ukončiť' : 'Upraviť'; this.renderList(); });
    $('#pl-geo').addEventListener('click', () => this.addGeo());
    this.renderList();
    if (focusSearch) setTimeout(() => input.focus(), 60);
  },

  onQuery(v) {
    this.q = v.trim();
    clearTimeout(this.timer);
    if (this.q.length < 2) { this.results = []; this.searchErr = ''; this.renderResults(); return; }
    this.searching = true; this.renderResults();
    this.timer = setTimeout(async () => {
      const q = this.q;
      try { const r = await searchPlaces(q); if (q !== this.q) return; this.results = r; this.searchErr = ''; }
      catch { this.results = []; this.searchErr = 'Vyhľadávanie zlyhalo. Skontroluj pripojenie na internet.'; }
      this.searching = false; this.renderResults();
    }, 300);
  },

  renderResults() {
    const ul = $('#pl-results');
    if (!ul) return;
    if (this.q.length < 2) { ul.hidden = true; ul.innerHTML = ''; return; }
    ul.hidden = false;
    if (this.searching && !this.results.length) { ul.innerHTML = '<li class="note">Hľadám…</li>'; return; }
    if (this.searchErr) { ul.innerHTML = `<li class="note">${esc(this.searchErr)}</li>`; return; }
    if (!this.results.length) { ul.innerHTML = `<li class="note">Nenašiel som miesto „${esc(this.q)}“. Skús iný názov.</li>`; return; }
    ul.innerHTML = this.results.map((r, i) => `<li><button data-i="${i}"><span><span class="r-name">${esc(r.name)}</span><br><span class="r-sub">${esc([r.admin1, r.country].filter(Boolean).join(', '))}</span></span><span class="r-add">${ico('plus', 20, 2)}</span></button></li>`).join('');
    $$('button', ul).forEach((b) => b.addEventListener('click', () => this.add(this.results[+b.dataset.i])));
  },

  add(r) {
    const id = 'g' + r.id;
    const existing = Wx.places.findIndex((p) => p.id === id);
    if (existing >= 0) { Wx.sel = existing; }
    else {
      Wx.places.push({ id, name: r.name, admin: r.admin1 || '', country: r.country || '', lat: r.latitude, lon: r.longitude });
      Wx.sel = Wx.places.length - 1;
    }
    Wx.save();
    toast(`Pridané: ${r.name}`);
    Sheet.close();
    Wx.render();
    Wx.load(Wx.current(), true).then(() => Wx.render());
  },

  addGeo() {
    const btn = $('#pl-geo');
    if (!navigator.geolocation) { toast('Tento prehliadač nepodporuje zisťovanie polohy.'); return; }
    btn.disabled = true; btn.lastChild.textContent = 'Zisťujem polohu…';
    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = +pos.coords.latitude.toFixed(4), lon = +pos.coords.longitude.toFixed(4);
      let name = 'Moja poloha', admin = '', country = '';
      try {
        const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=sk`);
        const j = await r.json();
        name = j.city || j.locality || name; admin = j.principalSubdivision || ''; country = j.countryName || '';
      } catch {}
      const place = { id: 'geo', geo: true, name, admin, country, lat, lon };
      const i = Wx.places.findIndex((p) => p.id === 'geo');
      if (i >= 0) Wx.places[i] = place; else Wx.places.unshift(place);
      Wx.sel = Wx.places.findIndex((p) => p.id === 'geo');
      Wx.save();
      Sheet.close();
      Wx.render();
      Wx.load(place, true).then(() => Wx.render());
    }, (err) => {
      btn.disabled = false; btn.lastChild.textContent = 'Pridať moju polohu';
      toast(err.code === 1 ? 'Prístup k polohe je zakázaný. Povoľ ho v nastaveniach prehliadača.' : 'Polohu sa nepodarilo zistiť. Skús to znova.');
    }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 10 * 60 * 1000 });
  },

  renderList() {
    const ul = $('#pl-list');
    if (!ul) return;
    if (!Wx.places.length) { ul.innerHTML = '<li class="results"><p class="note">Zatiaľ nemáš žiadne miesto. Vyhľadaj ho vyššie.</p></li>'; return; }
    ul.innerHTML = Wx.places.map((p, i) => {
      const c = Wx.cache[p.id];
      const d = c && c.data;
      const bg = d ? skyFor(d.current.weather_code, d.current.is_day === 1) : skyFor(2, true);
      let sub = [p.admin, p.country].filter(Boolean).join(', ');
      if (d && d.utc_offset_seconds !== -new Date().getTimezoneOffset() * 60) {
        const t = new Date(Date.now() + d.utc_offset_seconds * 1000);
        sub = `${t.getUTCHours()}:${pad(t.getUTCMinutes())} · ${sub}`;
      }
      return `<li><div class="place-card${i === Wx.sel ? ' sel' : ''}" role="button" tabindex="0" data-i="${i}" style="background:${bg}">
        <div><div class="pc-name">${p.geo ? ico('pin', 14, 2.4) : ''}${esc(p.name)}</div><div class="pc-sub">${esc(sub)}</div></div>
        <div class="pc-temp">${d ? Math.round(d.current.temperature_2m) + '°' : '–'}</div>
        <div class="pc-cond">${d ? wxText(d.current.weather_code) : (Wx.pending[p.id] ? 'Načítavam…' : '')}</div>
        <div class="pc-hl">${d ? `Max. ${Math.round(d.daily.temperature_2m_max[0])}° Min. ${Math.round(d.daily.temperature_2m_min[0])}°` : ''}</div>
        ${this.editing ? `<div class="pc-edit">
          <button data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="Posunúť vyššie">${ico('up', 15, 2.2)}</button>
          <button data-act="down" ${i === Wx.places.length - 1 ? 'disabled' : ''} aria-label="Posunúť nižšie">${ico('down', 15, 2.2)}</button>
          <button data-act="rm" class="rm">${ico('close', 15, 2.2)}Odstrániť</button></div>` : ''}
      </div></li>`;
    }).join('');
    $$('.place-card', ul).forEach((card) => {
      const i = +card.dataset.i;
      card.addEventListener('click', (e) => {
        const act = e.target.closest('[data-act]');
        if (act) { e.stopPropagation(); this.act(act.dataset.act, i); return; }
        if (this.editing) return;
        Wx.sel = i; Wx.save(); Sheet.close(); Wx.render(); Wx.load(Wx.current()).then(() => Wx.render());
      });
      card.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === card) { e.preventDefault(); card.click(); } });
    });
  },

  act(what, i) {
    const P = Wx.places;
    const selId = P[Wx.sel] && P[Wx.sel].id;
    if (what === 'up' && i > 0) [P[i - 1], P[i]] = [P[i], P[i - 1]];
    if (what === 'down' && i < P.length - 1) [P[i + 1], P[i]] = [P[i], P[i + 1]];
    if (what === 'rm') {
      const [removed] = P.splice(i, 1);
      const cached = Wx.cache[removed.id];
      store.del('wx.' + removed.id);
      toast(`Odstránené: ${removed.name}`, 'Späť', () => {
        P.splice(i, 0, removed);
        if (cached) { Wx.cache[removed.id] = cached; store.set('wx.' + removed.id, cached); }
        Wx.save(); this.renderList(); Wx.render();
      });
    }
    const ni = P.findIndex((p) => p.id === selId);
    Wx.sel = ni >= 0 ? ni : clamp(Wx.sel, 0, Math.max(0, P.length - 1));
    Wx.save();
    this.renderList();
  }
};
