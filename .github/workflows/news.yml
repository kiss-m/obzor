# Každých 30 minút stiahne správy z RSS zdrojov (scripts/feeds.json)
# a zverejní ich ako news.json vo vetve "news". Appka si ich odtiaľ načíta.
name: Novinky

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/news.yml'

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Predchádzajúce správy
        run: |
          if git fetch --depth=1 origin news:news-prev 2>/dev/null; then
            git show news-prev:news.json > prev.json || echo '{}' > prev.json
          else
            echo '{}' > prev.json
          fi

      - name: Zber noviniek
        run: node scripts/fetch-news.mjs news.json prev.json

      - name: Zverejnenie do vetvy news
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp news.json out/
          cd out
          git init -q -b news
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -qm "Novinky $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news
